name: openvma-migration-rehearsal

services:
  rehearsal-db:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      POSTGRES_USER: openvma_rehearsal
      POSTGRES_PASSWORD: openvma_rehearsal_only
      POSTGRES_DB: openvma_rehearsal_021
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=2g,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvma_rehearsal -d openvma_rehearsal_021"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
