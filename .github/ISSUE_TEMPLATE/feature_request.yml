name: Feature request
description: Propose an improvement grounded in a use case
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, provider dependencies and acceptance criteria
