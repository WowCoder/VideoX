name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - frontend/pages/**
      - frontend/src/pagesMain.tsx
      - frontend/src/components/BrandLogo.tsx
      - frontend/src/views/SiteHome.tsx
      - frontend/src/views/SiteHome.css
      - frontend/src/views/siteContent.ts
      - frontend/public/media/showcase/**
      - frontend/vite.pages.config.ts
      - frontend/package.json
      - frontend/package-lock.json
      - docs/github-pages.md
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:pages
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-pages
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
