name: videox-export-rehearsal

services:
  rehearsal-db:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      POSTGRES_USER: videox_export_rehearsal
      POSTGRES_PASSWORD: videox_export_rehearsal_only
      POSTGRES_DB: videox_export_rehearsal
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=2g,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videox_export_rehearsal -d videox_export_rehearsal"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  rehearsal-redis:
    image: redis:7-alpine
    restart: "no"
    ports:
      - "127.0.0.1:56380:6379"
    tmpfs:
      - /data:size=256m,mode=0700
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  rehearsal-minio:
    image: minio/minio:latest
    restart: "no"
    environment:
      MINIO_ROOT_USER: videox_export_rehearsal
      MINIO_ROOT_PASSWORD: videox_export_rehearsal_only
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:59010:9000"
      - "127.0.0.1:59011:9001"
    tmpfs:
      - /data:size=2g,mode=0700
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
