name: openvma-production

x-app-image: &app-image
  image: ${OPENVMA_BACKEND_IMAGE:-openvma-backend}:${OPENVMA_IMAGE_TAG:-latest}
  build:
    context: ./backend
    dockerfile: Dockerfile
    args:
      OPENVMA_APT_MIRROR: ${OPENVMA_APT_MIRROR:-}
      OPENVMA_PIP_INDEX_URL: ${OPENVMA_PIP_INDEX_URL:-}

x-app-runtime: &app-runtime
  <<: *app-image
  env_file:
    - ${OPENVMA_ENV_FILE:-.env.production}
  networks:
    - private
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openvma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-openvma}
    volumes:
      - openvma_pgdata:/var/lib/postgresql/data
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - openvma_redisdata:/data
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    command: server /data --console-address ":9001"
    volumes:
      - openvma_miniodata:/data
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio-init:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-openvma-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set openvma http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" &&
        mc mb --ignore-existing "openvma/$${MINIO_BUCKET}"
    networks:
      - private
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *app-runtime
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]

  backend:
    <<: *app-runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "8000"
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s

  celery-worker:
    <<: *app-runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - exec celery -A app.tasks.celery_app worker --loglevel=info --concurrency="$${CELERY_WORKER_CONCURRENCY:-1}" --queues="$${CELERY_TASK_DEFAULT_QUEUE:-openvma-production}"
    stop_grace_period: 2m

  celery-beat:
    <<: *app-runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/openvma-celerybeat-schedule"]

  gateway:
    image: ${OPENVMA_GATEWAY_IMAGE:-openvma-gateway}:${OPENVMA_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        OPENVMA_NPM_REGISTRY: ${OPENVMA_NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?MEDIA_DOMAIN is required}
    ports:
      - "${GATEWAY_BIND_IP:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5

  admin-gateway:
    image: ${OPENVMA_ADMIN_GATEWAY_IMAGE:-openvma-admin-gateway}:${OPENVMA_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.admin
      args:
        OPENVMA_NPM_REGISTRY: ${OPENVMA_NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
    ports:
      - "${ADMIN_GATEWAY_BIND_IP:-127.0.0.1}:${ADMIN_GATEWAY_PORT:-8081}:8080"
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5

  local-embedding:
    profiles: ["local-ai"]
    image: ${OPENVMA_EMBEDDING_IMAGE:-openvma-local-embedding}:${OPENVMA_IMAGE_TAG:-latest}
    build:
      context: ./local-ai/embedding
    restart: unless-stopped
    environment:
      LOCAL_AI_API_KEY: ${LOCAL_AI_API_KEY:-}
      EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-1024}
      MODEL_DEVICE: ${LOCAL_AI_DEVICE:-cpu}
      HF_HOME: /models/huggingface
      MODEL_SOURCE: ${LOCAL_MODEL_SOURCE:-modelscope}
      MODELSCOPE_CACHE: /models/modelscope
    volumes:
      - openvma_huggingface_models:/models/huggingface
      - openvma_modelscope_models:/models/modelscope
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  local-reranker:
    profiles: ["local-ai"]
    image: ${OPENVMA_RERANKER_IMAGE:-openvma-local-reranker}:${OPENVMA_IMAGE_TAG:-latest}
    build:
      context: ./local-ai/reranker
    restart: unless-stopped
    environment:
      LOCAL_AI_API_KEY: ${LOCAL_AI_API_KEY:-}
      RERANK_MODEL: ${AI_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      MODEL_DEVICE: ${LOCAL_AI_DEVICE:-cpu}
      HF_HOME: /models/huggingface
      MODEL_SOURCE: ${LOCAL_MODEL_SOURCE:-modelscope}
      MODELSCOPE_CACHE: /models/modelscope
    volumes:
      - openvma_huggingface_models:/models/huggingface
      - openvma_modelscope_models:/models/modelscope
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  local-asr:
    profiles: ["local-ai"]
    image: ${OPENVMA_ASR_IMAGE:-openvma-local-asr}:${OPENVMA_IMAGE_TAG:-latest}
    build:
      context: ./local-ai/asr
    restart: unless-stopped
    environment:
      LOCAL_AI_API_KEY: ${LOCAL_AI_API_KEY:-}
      MODEL_DEVICE: ${LOCAL_AI_DEVICE:-cpu}
      MODELSCOPE_CACHE: /models/modelscope
    volumes:
      - openvma_modelscope_models:/models/modelscope
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 240s

  local-ocr:
    profiles: ["local-ai"]
    image: ${OPENVMA_OCR_IMAGE:-openvma-local-ocr}:${OPENVMA_IMAGE_TAG:-latest}
    build:
      context: ./local-ai/ocr
    restart: unless-stopped
    environment:
      LOCAL_AI_API_KEY: ${LOCAL_AI_API_KEY:-}
      OCR_MODEL: ${AI_OCR_MODEL:-PP-OCRv4-ONNX}
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

networks:
  private:
    driver: bridge

volumes:
  openvma_pgdata:
  openvma_redisdata:
  openvma_miniodata:
  openvma_huggingface_models:
  openvma_modelscope_models:
