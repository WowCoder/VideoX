name: videox-production

x-app-image: &app-image
  image: ${VIDEOX_BACKEND_IMAGE:-videox-backend}:${VIDEOX_IMAGE_TAG:-latest}
  build:
    context: ./backend
    dockerfile: Dockerfile
    args:
      VIDEOX_APT_MIRROR: ${VIDEOX_APT_MIRROR:-}
      VIDEOX_PIP_INDEX_URL: ${VIDEOX_PIP_INDEX_URL:-}

x-app-runtime: &app-runtime
  <<: *app-image
  env_file:
    - ${VIDEOX_ENV_FILE:-.env.production}
  networks:
    - private
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-videox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-videox}
    volumes:
      - videox_pgdata:/var/lib/postgresql/data
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - videox_redisdata:/data
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    command: server /data --console-address ":9001"
    volumes:
      - videox_miniodata:/data
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio-init:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-videox-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set videox http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" &&
        mc mb --ignore-existing "videox/$${MINIO_BUCKET}"
    networks:
      - private
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *app-runtime
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]

  backend:
    <<: *app-runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "8000"
    volumes:
      - ${HOST_METRICS_PATH:-./.host-metrics}:/host-metrics-disk:ro
    command:
      - /bin/sh
      - -c
      - exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers "$${WEB_CONCURRENCY:-3}" --proxy-headers --forwarded-allow-ips="*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s

  celery-worker:
    <<: *app-runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - exec celery -A app.tasks.celery_app worker --loglevel=info --concurrency="$${CELERY_SHORT_AI_CONCURRENCY:-2}" --queues="$${CELERY_SHORT_AI_QUEUE:-$${CELERY_TASK_DEFAULT_QUEUE:-videox-production}.short-ai},$${CELERY_TASK_DEFAULT_QUEUE:-videox-production}"
    stop_grace_period: 2m
    volumes:
      - ${HOST_METRICS_PATH:-./.host-metrics}:/host-metrics-disk:ro

  celery-control:
    <<: *app-runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - exec celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1 --queues="$${CELERY_CONTROL_QUEUE:-$${CELERY_TASK_DEFAULT_QUEUE:-videox-production}.control}"

  celery-video:
    <<: *app-runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - exec celery -A app.tasks.celery_app worker --loglevel=info --concurrency="$${CELERY_VIDEO_CONCURRENCY:-2}" --queues="$${CELERY_VIDEO_QUEUE:-$${CELERY_TASK_DEFAULT_QUEUE:-videox-production}.video}"
    stop_grace_period: 2m

  celery-media:
    <<: *app-runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - exec celery -A app.tasks.celery_app worker --loglevel=info --concurrency="$${CELERY_MEDIA_CONCURRENCY:-1}" --queues="$${CELERY_MEDIA_QUEUE:-$${CELERY_TASK_DEFAULT_QUEUE:-videox-production}.media}"
    stop_grace_period: 2m

  celery-export:
    <<: *app-runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - exec celery -A app.tasks.celery_app worker --loglevel=info --concurrency="$${CELERY_EXPORT_CONCURRENCY:-1}" --queues="$${CELERY_EXPORT_QUEUE:-$${CELERY_TASK_DEFAULT_QUEUE:-videox-production}.export}"
    stop_grace_period: 2m

  celery-beat:
    <<: *app-runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/videox-celerybeat-schedule"]

  gateway:
    image: ${VIDEOX_GATEWAY_IMAGE:-videox-gateway}:${VIDEOX_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VIDEOX_NPM_REGISTRY: ${VIDEOX_NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?MEDIA_DOMAIN is required}
    ports:
      - "${GATEWAY_BIND_IP:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5

  admin-gateway:
    image: ${VIDEOX_ADMIN_GATEWAY_IMAGE:-videox-admin-gateway}:${VIDEOX_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.admin
      args:
        VIDEOX_NPM_REGISTRY: ${VIDEOX_NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
    ports:
      - "${ADMIN_GATEWAY_BIND_IP:-127.0.0.1}:${ADMIN_GATEWAY_PORT:-8081}:8080"
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5

  local-embedding:
    profiles: ["local-ai"]
    image: ${VIDEOX_EMBEDDING_IMAGE:-videox-local-embedding}:${VIDEOX_IMAGE_TAG:-latest}
    build:
      context: ./local-ai/embedding
    restart: unless-stopped
    environment:
      LOCAL_AI_API_KEY: ${LOCAL_AI_API_KEY:-}
      EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-1024}
      MODEL_DEVICE: ${LOCAL_AI_DEVICE:-cpu}
      HF_HOME: /models/huggingface
      MODEL_SOURCE: ${LOCAL_MODEL_SOURCE:-modelscope}
      MODELSCOPE_CACHE: /models/modelscope
    volumes:
      - videox_huggingface_models:/models/huggingface
      - videox_modelscope_models:/models/modelscope
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  local-reranker:
    profiles: ["local-ai"]
    image: ${VIDEOX_RERANKER_IMAGE:-videox-local-reranker}:${VIDEOX_IMAGE_TAG:-latest}
    build:
      context: ./local-ai/reranker
    restart: unless-stopped
    environment:
      LOCAL_AI_API_KEY: ${LOCAL_AI_API_KEY:-}
      RERANK_MODEL: ${AI_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      MODEL_DEVICE: ${LOCAL_AI_DEVICE:-cpu}
      HF_HOME: /models/huggingface
      MODEL_SOURCE: ${LOCAL_MODEL_SOURCE:-modelscope}
      MODELSCOPE_CACHE: /models/modelscope
    volumes:
      - videox_huggingface_models:/models/huggingface
      - videox_modelscope_models:/models/modelscope
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  local-asr:
    profiles: ["local-ai"]
    image: ${VIDEOX_ASR_IMAGE:-videox-local-asr}:${VIDEOX_IMAGE_TAG:-latest}
    build:
      context: ./local-ai/asr
    restart: unless-stopped
    environment:
      LOCAL_AI_API_KEY: ${LOCAL_AI_API_KEY:-}
      MODEL_DEVICE: ${LOCAL_AI_DEVICE:-cpu}
      MODELSCOPE_CACHE: /models/modelscope
    volumes:
      - videox_modelscope_models:/models/modelscope
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 240s

  local-ocr:
    profiles: ["local-ai"]
    image: ${VIDEOX_OCR_IMAGE:-videox-local-ocr}:${VIDEOX_IMAGE_TAG:-latest}
    build:
      context: ./local-ai/ocr
    restart: unless-stopped
    environment:
      LOCAL_AI_API_KEY: ${LOCAL_AI_API_KEY:-}
      OCR_MODEL: ${AI_OCR_MODEL:-PP-OCRv4-ONNX}
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

networks:
  private:
    driver: bridge

volumes:
  videox_pgdata:
  videox_redisdata:
  videox_miniodata:
  videox_huggingface_models:
  videox_modelscope_models:
